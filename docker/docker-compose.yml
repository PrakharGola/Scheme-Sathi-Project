version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: schemesathi
      POSTGRES_USER: schemesathi
      POSTGRES_PASSWORD: schemesathi
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment:
      DATABASE_URL: postgres://schemesathi:schemesathi@db:5432/schemesathi
      JWT_SECRET: "super-secret-change"
      CORS_ORIGIN: "http://localhost:5173"
    depends_on:
      - db
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
